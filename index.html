<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دمياطي | الرئيسية</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f0f4f8;color:#263445}
header{position:sticky;top:0;z-index:10;background:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px #0001}
.logo{font-size:22px;font-weight:bold;color:#1769aa;white-space:nowrap}
.search{flex:1;min-width:0;border:0;background:#eef3f8;border-radius:22px;padding:12px;outline:none}
.headbtn{border:0;background:#e8f2fb;color:#1769aa;border-radius:12px;padding:10px;font-size:17px}
.container{max-width:720px;margin:16px auto;padding:0 12px}
.card,.post{background:#fff;border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:0 2px 8px #0000000a}
.welcome{background:linear-gradient(120deg,#1769aa,#4b9bd3);color:#fff;padding:20px;border-radius:15px;margin-bottom:14px}
.welcome h2{margin:0 0 8px}.welcome p{line-height:1.7;margin:0}
.section-title{font-size:18px;color:#1769aa;margin:0 0 13px}
.links{display:flex;gap:8px;overflow-x:auto}
.links a{flex:1;min-width:95px;text-align:center;text-decoration:none;color:#1769aa;background:#eaf3fb;padding:12px 8px;border-radius:11px;font-weight:bold}
textarea,input,select{width:100%;padding:12px;border:1px solid #dce4ec;border-radius:10px;font:15px Arial;margin:0 0 10px;outline-color:#398bc5}
textarea{min-height:85px;resize:vertical}
button{cursor:pointer}
.primary{background:#1769aa;color:white;border:0;border-radius:10px;padding:12px 18px;font-size:15px}
.secondary{background:#e8f2fb;color:#1769aa;border:0;border-radius:9px;padding:10px 13px}
#preview,.post-images{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:8px 0}
#preview img,.post-images img{width:100%;max-height:260px;object-fit:cover;border-radius:9px}
.preview-item{position:relative}
.preview-item button{position:absolute;top:5px;left:5px;border:0;border-radius:50%;background:#fff;color:#a22;width:27px;height:27px}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#eaf3fb}
.post-name{font-weight:bold;color:#1769aa}
.post-date{font-size:12px;color:#8995a2;margin-top:4px}
.post-text{line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.post-actions{display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid #edf0f3;margin-top:12px;padding-top:10px}
.post-actions button{flex:1;min-width:75px}
#status{text-align:center;color:#687787;padding:12px}
.bottom-nav{position:sticky;bottom:0;background:#fff;display:flex;justify-content:space-around;padding:11px 3px;box-shadow:0 -2px 8px #0001}
.bottom-nav a{color:#1769aa;text-decoration:none;text-align:center;font-size:13px}
@media(max-width:420px){.logo{font-size:19px}.search{padding:10px}}
</style>
</head>
<body>
<header>
  <div class="logo">دمياطي</div>
  <input class="search" id="searchInput" placeholder="ابحث في المنشورات...">
  <button class="headbtn" onclick="location.href='messages.html'" aria-label="الرسائل">✉</button>
</header>

<main class="container">
  <section class="welcome">
    <h2>أهلاً بيك في دمياطي</h2>
    <p>مجتمع الأثاث في دمياط. تابع المعارض والأعضاء واكتشف أحدث المنشورات.</p>
  </section>

  <section class="card">
    <h3 class="section-title">اكتشف دمياطي</h3>
    <div class="links">
      <a href="market.html">🛋️<br>سوق الأثاث</a>
      <a href="messages.html">💬<br>الرسائل</a>
      <a href="profile.html">👤<br>حسابي</a>
      <a href="register.html">🏬<br>سجّل معرضك</a>
    </div>
  </section>

  <section class="card">
    <h3 class="section-title">بماذا تفكر؟</h3>
    <textarea id="description" placeholder="اكتب منشورك هنا..."></textarea>
    <input id="title" placeholder="عنوان المنشور (اختياري)">
    <input id="price" type="number" min="0" placeholder="السعر بالجنيه (اختياري)">
    <select id="postType">
      <option value="عام">منشور عام</option>
      <option value="بيع">عرض منتج للبيع</option>
      <option value="طلب">طلب شراء</option>
    </select>
    <label for="images">إضافة صور (يمكن اختيار أكثر من صورة)</label>
    <input id="images" type="file" accept="image/*" multiple>
    <div id="preview"></div>
    <button class="primary" id="publishBtn" onclick="createPost()">نشر المنشور</button>
  </section>

  <h3 class="section-title">أحدث المنشورات</h3>
  <div id="status">جارٍ تحميل المنشورات...</div>
  <div id="posts"></div>
</main>

<nav class="bottom-nav">
  <a href="index.html">🏠<br>الرئيسية</a>
  <a href="market.html">🛋️<br>السوق</a>
  <a href="messages.html">💬<br>الرسائل</a>
  <a href="profile.html">👤<br>حسابي</a>
</nav>

<script>
const SUPABASE_URL = "https://lytlefegtvcjgfvfbwnu.supabase.co";
const SUPABASE_KEY = "sb_publishable_sIBXEfGZV73j0kDb27oykw_KsPcD0dk";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let allPosts = [];
let selectedFiles = [];

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  })[c]);
}

function userDisplayName() {
  const m = currentUser?.user_metadata || {};
  return m.showroom_name || m.full_name || currentUser?.email || "عضو في دمياطي";
}

document.getElementById("images").addEventListener("change", event => {
  selectedFiles = Array.from(event.target.files || []);
  showPreview();
});

function showPreview() {
  const box = document.getElementById("preview");
  box.innerHTML = "";
  selectedFiles.forEach((file, index) => {
    const url = URL.createObjectURL(file);
    const item = document.createElement("div");
    item.className = "preview-item";
    item.innerHTML = `<img src="${url}" alt="معاينة الصورة">
      <button type="button" aria-label="حذف الصورة" onclick="removePreview(${index})">×</button>`;
    box.appendChild(item);
  });
}

function removePreview(index) {
  selectedFiles.splice(index, 1);
  const input = document.getElementById("images");
  const transfer = new DataTransfer();
  selectedFiles.forEach(file => transfer.items.add(file));
  input.files = transfer.files;
  showPreview();
}

async function startPage() {
  const { data, error } = await db.auth.getUser();
  if (error) console.warn(error.message);
  currentUser = data?.user || null;
  await loadPosts();
}

async function loadPosts() {
  const status = document.getElementById("status");
  const area = document.getElementById("posts");
  status.textContent = "جارٍ تحميل المنشورات...";
  area.innerHTML = "";

  const { data, error } = await db.from("posts")
    .select("*").order("created_at", { ascending: false }).limit(60);

  if (error) {
    status.textContent = "تعذر تحميل المنشورات: " + error.message;
    return;
  }

  allPosts = data || [];
  if (!allPosts.length) {
    status.textContent = "لسه مفيش منشورات. كن أول من ينشر في دمياطي.";
    return;
  }

  const ids = allPosts.map(p => p.id);
  const { data: imageRows, error: imageError } = await db
    .from("post_images").select("post_id,image_url").in("post_id", ids);

  const imagesMap = {};
  if (!imageError) {
    (imageRows || []).forEach(row => {
      (imagesMap[row.post_id] ||= []).push(row.image_url);
    });
  }

  const { data: likesRows } = await db
    .from("post_likes").select("post_id,user_id").in("post_id", ids);

  const likesMap = {};
  const likedByMe = {};
  (likesRows || []).forEach(row => {
    likesMap[row.post_id] = (likesMap[row.post_id] || 0) + 1;
    if (currentUser && row.user_id === currentUser.id) likedByMe[row.post_id] = true;
  });

  status.textContent = "";
  allPosts.forEach(post => {
    let urls = imagesMap[post.id] || [];
    if (!urls.length && post.image_url) urls = [post.image_url];

    const owner = currentUser && currentUser.id === post.user_id;
    const pics = urls.map(url => `<img src="${escapeHTML(url)}" alt="صورة المنشور">`).join("");
    const date = post.created_at ? new Date(post.created_at).toLocaleDateString("ar-EG") : "";
    const article = document.createElement("article");
    article.className = "post";
    article.dataset.search = `${post.title || ""} ${post.description || ""} ${post.user_name || ""} ${post.post_type || ""}`.toLowerCase();

    article.innerHTML = `
      <div class="post-head">
        <img class="avatar" src="${escapeHTML(post.user_avatar || "https://placehold.co/100x100?text=D")}" alt="">
        <div><div class="post-name">${escapeHTML(post.user_name || "عضو في دمياطي")}</div>
        <div class="post-date">${escapeHTML(date)}</div></div>
      </div>
      ${post.title ? `<h3>${escapeHTML(post.title)}</h3>` : ""}
      <div class="post-text">${escapeHTML(post.description)}</div>
      ${post.price !== null && post.price !== "" ? `<p>السعر: ${escapeHTML(post.price)} جنيه</p>` : ""}
      ${post.post_type ? `<div class="post-date">${escapeHTML(post.post_type)}</div>` : ""}
      ${pics ? `<div class="post-images">${pics}</div>` : ""}
      <div class="post-actions">
        <button class="secondary" onclick="toggleLike(${Number(post.id)})">👍 ${likedByMe[post.id] ? "أعجبني" : "إعجاب"} (${likesMap[post.id] || 0})</button>
        <button class="secondary" onclick="sendMessage('${escapeHTML(post.user_id || "")}')">💬 رسالة</button>
        ${owner ? `<button class="secondary" onclick="editPost(${Number(post.id)})">✏️ تعديل</button>
        <button class="secondary" onclick="deletePost(${Number(post.id)})">🗑️ حذف</button>` : ""}
      </div>`;
    area.appendChild(article);
  });
}

async function createPost() {
  if (!currentUser) {
    alert("سجل دخولك أولاً حتى تستطيع النشر.");
    location.href = "login.html";
    return;
  }

  const description = document.getElementById("description").value.trim();
  const title = document.getElementById("title").value.trim();
  const priceText = document.getElementById("price").value.trim();
  const postType = document.getElementById("postType").value;

  if (!description) {
    alert("اكتب محتوى المنشور أولاً.");
    return;
  }
  if (priceText && (!Number.isFinite(Number(priceText)) || Number(priceText) < 0)) {
    alert("اكتب سعرًا صحيحًا.");
    return;
  }

  const button = document.getElementById("publishBtn");
  button.disabled = true;
  button.textContent = "جارٍ النشر...";

  try {
    const uploaded = [];
    for (let i = 0; i < selectedFiles.length; i++) {
      const file = selectedFiles[i];
      if (!file.type.startsWith("image/")) throw new Error("اختر ملفات صور فقط.");
      const ext = (file.name.split(".").pop() || "jpg").replace(/[^a-zA-Z0-9]/g, "");
      const path = `${currentUser.id}/${Date.now()}_${i}.${ext}`;
      const { error: upError } = await db.storage.from("post-images").upload(path, file);
      if (upError) throw upError;
      const { data: publicData } = db.storage.from("post-images").getPublicUrl(path);
      uploaded.push(publicData.publicUrl);
    }

    const meta = currentUser.user_metadata || {};
    const { data: newPost, error: postError } = await db.from("posts").insert({
      user_id: currentUser.id,
      title: title || null,
      description,
      price: priceText ? Number(priceText) : null,
      post_type: postType,
      image_url: uploaded[0] || null,
      user_name: userDisplayName(),
      user_avatar: meta.avatar_url || null
    }).select().single();

    if (postError) throw postError;

    if (uploaded.length) {
      const rows = uploaded.map(url => ({ post_id: newPost.id, image_url: url }));
      const { error: rowsError } = await db.from("post_images").insert(rows);
      if (rowsError) {
        alert("تم نشر المنشور، لكن تعذر حفظ قائمة الصور الإضافية: " + rowsError.message);
      }
    }

    document.getElementById("description").value = "";
    document.getElementById("title").value = "";
    document.getElementById("price").value = "";
    document.getElementById("images").value = "";
    selectedFiles = [];
    showPreview();
    alert("تم نشر المنشور.");
    await loadPosts();
  } catch (err) {
    alert("لم يتم النشر: " + (err.message || "حدث خطأ غير معروف"));
  } finally {
    button.disabled = false;
    button.textContent = "نشر المنشور";
  }
}

async function toggleLike(postId) {
  if (!currentUser) {
    alert("سجل دخولك أولاً للإعجاب بالمنشورات.");
    location.href = "login.html";
    return;
  }
  const { data: existing, error: findError } = await db.from("post_likes")
    .select("post_id").eq("post_id", postId).eq("user_id", currentUser.id).maybeSingle();
  if (findError) {
    alert("تعذر التحقق من الإعجاب: " + findError.message);
    return;
  }
  let result;
  if (existing) {
    result = await db.from("post_likes").delete()
      .eq("post_id", postId).eq("user_id", currentUser.id);
  } else {
    result = await db.from("post_likes").insert({ post_id: postId, user_id: currentUser.id });
  }
  if (result.error) alert("تعذر تسجيل الإعجاب: " + result.error.message);
  else await loadPosts();
}

function sendMessage(userId) {
  if (!currentUser) {
    alert("سجل دخولك أولاً لإرسال رسالة.");
    location.href = "login.html";
    return;
  }
  if (!userId || userId === currentUser.id) {
    alert("لا يمكنك مراسلة حسابك من هذا المنشور.");
    return;
  }
  location.href = "messages.html?to=" + encodeURIComponent(userId);
}

async function editPost(id) {
  const post = allPosts.find(p => Number(p.id) === Number(id));
  if (!post || !currentUser || post.user_id !== currentUser.id) {
    alert("لا يمكنك تعديل هذا المنشور.");
    return;
  }

  const newTitle = prompt("عنوان المنشور:", post.title || "");
  if (newTitle === null) return;
  const newDescription = prompt("محتوى المنشور:", post.description || "");
  if (newDescription === null || !newDescription.trim()) return;
  const newPrice = prompt("السعر بالجنيه (اتركه فارغًا إذا لا يوجد):", post.price ?? "");
  if (newPrice === null) return;
  if (newPrice.trim() && (!Number.isFinite(Number(newPrice)) || Number(newPrice) < 0)) {
    alert("السعر غير صحيح.");
    return;
  }

  const { error } = await db.from("posts").update({
    title: newTitle.trim() || null,
    description: newDescription.trim(),
    price: newPrice.trim() ? Number(newPrice) : null
  }).eq("id", id).eq("user_id", currentUser.id);

  if (error) alert("تعذر تعديل المنشور: " + error.message);
  else {
    alert("تم تعديل المنشور.");
    await loadPosts();
  }
}

async function deletePost(id) {
  if (!currentUser || !confirm("هل أنت متأكد من حذف المنشور؟")) return;
  const { error } = await db.from("posts").delete()
    .eq("id", id).eq("user_id", currentUser.id);
  if (error) {
    alert("تعذر حذف المنشور: " + error.message);
    return;
  }
  alert("تم حذف المنشور.");
  await loadPosts();
}

document.getElementById("searchInput").addEventListener("input", event => {
  const term = event.target.value.trim().toLowerCase();
  document.querySelectorAll("#posts .post").forEach(card => {
    card.style.display = card.dataset.search.includes(term) ? "" : "none";
  });
});

startPage();
</script>
</body>
</html>
