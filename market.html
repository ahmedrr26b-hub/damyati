<body>
<script>
const SUPABASE_URL
="https://lytlefegtvcjgfvfbwnu.supabase.co";
const SUPABASE_KEY
="sb_publishable_sIBXEfGZV73j0kDb27oykw_KsPcD0dk";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function showUserInfo() {
  const { data } = await db.auth.getUser();
  const user = data.user;

  if (!user) return;

  const info = user.user_metadata || {};
  const name = info.full_name || "مستخدم دمياطي";
  const avatar = info.avatar_url || "https://placehold.co/50x50?text=User";

  document.querySelectorAll(".card").forEach(card => {
    const header = card.querySelector("h3");
    if (!header) return;

    const userInfo = document.createElement("p");
    userInfo.innerHTML = `
      <img src="${avatar}" style="width:40px;height:40px;border-radius:50%;vertical-align:middle">
      <strong>${name}</strong>
    `;
    header.after(userInfo);
  });
}

showUserInfo();
</script>
