
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل المعارض - دمياطي</title>
<style>
body{font-family:Arial;background:#f2f6fc;margin:0;color:#17365d}
header{background:#123d70;color:white;text-align:center;padding:25px}
main{max-width:500px;margin:25px auto;padding:20px;background:white;border-radius:12px}
h2{text-align:center}
label{display:block;margin-top:15px}
input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin-top:7px;border:1px solid #ccc;border-radius:7px;font-size:16px}
button{width:100%;background:#174f8c;color:white;border:0;padding:14px;margin-top:20px;border-radius:7px;font-size:17px}
.note{color:#666;text-align:center;font-size:14px}
</style>
</head>
<body>
<header>
<h1>دمياطي</h1>
<p>سوق الأثاث المصري</p>
</header>
<main>
<h2>تسجيل معرض جديد</h2>
<p class="note">سجل بيانات معرضك لطلب الانضمام إلى دمياطي</p>
<form onsubmit="event.preventDefault();alert('هذه استمارة تجريبية. لم يتم إرسال البيانات بعد.');">
<label>اسم المعرض</label>
<input type="text" placeholder="اكتب اسم المعرض" required>
<label>اسم المسؤول</label>
<input type="text" placeholder="اسم صاحب المعرض أو المسؤول" required>
<label>رقم الهاتف</label>
<input type="tel" placeholder="01xxxxxxxxx" required>
<label>المحافظة</label>
<select required>
<option value="">اختر المحافظة</option>
<option>دمياط</option>
<option>القاهرة</option>
<option>الجيزة</option>
<option>الإسكندرية</option>
<option>الدقهلية</option>
<option>الشرقية</option>
<option>بورسعيد</option>
<option>أخرى</option>
</select>
<label>عنوان المعرض</label>
<textarea placeholder="اكتب العنوان بالتفصيل"></textarea>
<label>نوع الأثاث</label>
<input type="text" placeholder="غرف نوم، انتريهات، سفرة...">
<button type="submit">إرسال طلب التسجيل</button>
</form>
<p class="note">سيتم مراجعة بيانات المعرض قبل اعتماده</p>
</main>
</body>
</html>
